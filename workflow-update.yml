# This is a synchronized template of .github/workflows/deploy-container-app.yml.
# Keep it aligned with the authoritative direct OIDC deployment workflow.
# ============================================================
# GitHub Actions — Build, push, and deploy to Azure Container Apps
#
# The workflow uses GitHub OIDC (not ACR admin credentials) and updates the
# provisioned Container App directly. This ensures the write is traceable to
# the CI identity and the image labels are immutable pipeline evidence.
#
# Required GitHub Actions variables:
#   ACR_NAME, RESOURCE_GROUP_NAME, CONTAINER_APP_NAME
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# The federated Azure identity needs AcrPush on the registry plus Container Apps
# Contributor and Tag Contributor on the target Container App.
# ============================================================
name: Deploy Container App

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - '.github/workflows/deploy-container-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  IMAGE_NAME: compliance-demo-api

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in ACR_NAME RESOURCE_GROUP_NAME CONTAINER_APP_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "GitHub Actions variable $name is required." >&2
              exit 1
            fi
          done

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        run: |
          SHA_TAG="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
          LATEST_TAG="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"

          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "deployed-by=pipeline" \
            --label "pipeline-run-id=${{ github.run_id }}" \
            --label "commit-sha=${{ github.sha }}" \
            --label "branch=${{ github.ref_name }}" \
            --label "repository=${{ github.repository }}" \
            --label "workflow=${{ github.workflow }}" \
            -t "$SHA_TAG" \
            -t "$LATEST_TAG" \
            src/api/

          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          echo "Pushed: $SHA_TAG"

      - name: Deploy immutable image to Container App
        id: deploy
        run: |
          SHA_TAG="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --image "$SHA_TAG" \
            --output none

          APP_ID=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query id -o tsv)
          az tag update \
            --resource-id "$APP_ID" \
            --operation Merge \
            --tags \
              deployed-by=pipeline \
              pipeline-run-id="${{ github.run_id }}" \
              commit-sha="${{ github.sha }}" \
              branch="${{ github.ref_name }}" \
              repository="${{ github.repository }}" \
              workflow="${{ github.workflow }}" \
            --output none

          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Verify deployment health
        run: curl --fail --show-error --retry 6 --retry-delay 5 "https://${{ steps.deploy.outputs.fqdn }}/health"

      - name: Summary
        run: |
          echo "### Container App deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch**: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment**: Direct OIDC-authenticated Container App update" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App URL**: https://${{ steps.deploy.outputs.fqdn }}" >> "$GITHUB_STEP_SUMMARY"
